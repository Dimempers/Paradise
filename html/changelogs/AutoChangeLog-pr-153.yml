author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлен спрайтшит crafting с предварительно сгенерированными иконками для всех предметов, реактивов и инструментов, используемых в крафте. (PR #153)"
  - local: "Интерфейс крафта полностью локализован на русский язык (заголовок, кнопки, подсказки). (PR #153)"
  - qol: "Добавлена строка поиска по рецептам и возможность фильтрации по крафтовым только и компактному отображению. (PR #153)"
  - qol: "Добавлена вкладка «Материалы» для просмотра рецептов по используемым материалам. (PR #153)"
  - qol: "Добавлены переключатели «Показать только крафтовое» и «Компактный режим\". (PR #153)"
  - add: "Рецепты теперь помечаются как доступные для крафта, если игрок знает рецепт или он всегда доступен. (PR #153)"
  - add: "Добавлены подсказки с названиями инструментов при наведении на иконку отвертки‑ключа. (PR #153)"
  - qol: "Улучшена производительность отображения иконок благодаря предварительному кэшированию в спрайтшите. (PR #153)"