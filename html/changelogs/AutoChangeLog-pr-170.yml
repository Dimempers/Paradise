author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлен новый зомби-антагонист «Нулевой пациент» с возможностью мгновенного превращения и целью начала эпидемии. (PR #170)"
  - bugfix: "Исправлено взаимодействие с замороженными администраторами и проверки инвентаря при венткрауллинге. (PR #170)"
  - tweak: "Обновлена болезнь зомби: теперь использует общий метод `rot_all_limbs` и добавлена возможность мгновенного превращения. (PR #170)"
  - code_imp: "Улучшена логика заклинания когтей зомби: исправлена обработка сигналов при экипировке/разэкипировке. (PR #170)"
  - qol: "Добавлена роль зомби в настройки антагонистов с иконкой, возрастным ограничением и блокировкой видов. (PR #170)"
  - admin: "Добавлен «Нулевой пациент» в список антагонистов для администраторов. (PR #170)"
  - expansion: "Добавлены динамические правила для зомби (средина раунда и начало раунда) с конфигурацией «Нулевой пациент». (PR #170)"
  - image: "Обновлена иконка антагониста для роли зомби в меню предпочтений. (PR #170)"
  - server: "Обновлено создание трупов в аAway Missions: теперь призраки могут контролировать тела зомби. (PR #170)"