author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлены узлы ИИ (вычислительный и сетевой), которые можно построить для обеспечения памяти и пропускной способности ИИ. (PR #152)"
  - add: "Добавлены улучшения ИИ: расширенное хранилище, сетевой массив, нанитовый резервуар и нанитовый фабрикатор. (PR #152)"
  - add: "Добавлен диск сброса программ, позволяющий сбросить программы ИИ до заводских настроек. (PR #152)"
  - add: "Введена система программ ИИ, где ИИ может тратить память и пропускную способность на установку и улучшение различных программ. (PR #152)"
  - add: "Добавлен консоль управления ресурсами ИИ (TGUI) для просмотра распределённых ресурсов и активных узлов. (PR #152)"
  - add: "Добавлено новое оповещение \"Сброс программ\", появляющееся при сбросе программ ИИ. (PR #152)"
  - add: "Добавлен новый тип тревоги \"Tracking\" для оповещений о повышенном слежении. (PR #152)"
  - tweak: "Изменено ценообразование шаттловых поставок: теперь учитывается модификатор цены рынка ИИ. (PR #152)"
  - add: "ИИ теперь может заперть двери с использованием таймера болта. (PR #152)"
  - add: "Добавлена функция улучшенного слежения: ИИ может отслеживать мобильный объект и генерировать оповещения. (PR #152)"
  - sound: "Добавлен новый звуковой эффект magic_block.ogg. (PR #152)"